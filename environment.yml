# Conda environment reproducing the setup that produced the paper's results.
#
#   conda env create -f environment.yml
#   conda activate surrogate-metrics
#
# scikit-uplift is pip-only, so it is installed through the pip section.

name: surrogate-metrics

channels:
  - defaults
  - conda-forge

dependencies:
  - python=3.8.13
  - numpy=1.21.5
  - scipy=1.9.3
  - pandas=1.5.3
  - scikit-learn=1.1.3
  - matplotlib=3.5.1
  - pyarrow=17.0.0
  - pip
  - pip:
      - scikit-uplift==0.5.1
